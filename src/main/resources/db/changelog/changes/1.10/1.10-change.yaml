databaseChangeLog:
  - changeSet:
      id: creating_initial_tables
      author: Farid Gurbanov
      changes:
        - createTable:
            tableName: conversations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversations
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_messages
                    nullable: false
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: BIGINT
              - column:
                  name: client_message_id
                  type: VARCHAR(255)
              - column:
                  name: type
                  type: VARCHAR(255)
              - column:
                  name: text_content
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - createTable:
            tableName: attachments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_attachments
                    nullable: false
              - column:
                  name: message_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: uploader_id
                  type: BIGINT
              - column:
                  name: storage_key
                  type: VARCHAR(255)
              - column:
                  name: original_file_name
                  type: VARCHAR(255)
              - column:
                  name: content_type
                  type: VARCHAR(255)
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: checksum
                  type: VARCHAR(255)
              - column:
                  name: thumbnail_storage_key
                  type: VARCHAR(255)
              - column:
                  name: public_url
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - createTable:
            tableName: conversation_participants
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversation_participants
                    nullable: false
              - column:
                  name: conversation_id
                  type: BIGINT
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_messages_conversation
            baseTableName: messages
            baseColumnNames: conversation_id
            referencedTableName: conversations
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_attachments_message
            baseTableName: attachments
            baseColumnNames: message_id
            referencedTableName: messages
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_conversation_participants_conversation
            baseTableName: conversation_participants
            baseColumnNames: conversation_id
            referencedTableName: conversations
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: conversation_participants
            columnNames: conversation_id, user_id
            constraintName: uk_conversation_participants_conversation_user
