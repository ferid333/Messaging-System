name: CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  pull-request-rules:
    name: Pull Request Rules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^DVLP ]]; then
            echo "PR title must start with DVLP."
            echo "Actual title: $PR_TITLE"
            exit 1
          fi

          title_length=${#PR_TITLE}
          if (( title_length > 120 )); then
            echo "PR title must not be longer than 120 characters."
            echo "Actual length: $title_length"
            exit 1
          fi

      - name: Validate commit titles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          invalid_commits=$(git log --format='%H%x09%s' "$BASE_SHA..$HEAD_SHA" | awk -F '\t' '$2 !~ /^DVLP/ { print }')

          if [[ -n "$invalid_commits" ]]; then
            echo "Every commit title in the PR must start with DVLP."
            echo "$invalid_commits"
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
